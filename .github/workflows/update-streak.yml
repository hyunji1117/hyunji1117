name: Update GitHub streak

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download streak SVG
        run: |
          mkdir -p assets
          URL="https://streak-stats.demolab.com/?user=hyunji1117&theme=dark&hide_border=true&background=00000000&ring=20c997&fire=20c997&currStreakNum=20c997"
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 30 "$URL" -o /tmp/streak.svg && grep -q "Total Contributions" /tmp/streak.svg; then
              mv /tmp/streak.svg assets/github-streak.svg
              exit 0
            fi
            sleep 10
          done
          echo "streak-stats 응답 실패, 기존 파일 유지"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          git diff --cached --quiet || (git commit -m "chore: update streak stats" && git push)
